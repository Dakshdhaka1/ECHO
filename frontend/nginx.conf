server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Security headers for every response. Locations below use `expires` (not add_header) for caching,
    # so these server-level headers are inherited everywhere.
    # CSP: scripts only from this origin (the theme script is a file, not inline); inline styles are needed
    # for chart and animation style attributes; WebGL needs nothing extra.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # API -> Spring Boot backend (analysis requests can take a while in live mode)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # single-page app: client-side routes fall back to index.html
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
