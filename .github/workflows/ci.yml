name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - run: pip install -r requirements.txt "pytest>=8" "ruff>=0.6"
      - run: ruff check app pipelines tests
      - run: pytest -q

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # integration tests start PostgreSQL with Testcontainers (Docker is available on ubuntu runners)
      - run: ./mvnw -B -ntp test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    needs: [ml-service, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Start the stack in demo mode
        run: |
          cp .env.example .env
          ML_INSTALL_TRAINING=false docker compose --env-file .env -f infra/docker/docker-compose.yml up -d --build --wait --wait-timeout 600
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Service logs on failure
        if: failure()
        run: docker compose --env-file .env -f infra/docker/docker-compose.yml logs --tail 200
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-results
          path: frontend/e2e/.results
